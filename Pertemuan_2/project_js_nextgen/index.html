<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dasbor Pribadi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="header card">
      <div>
        <h1>Dasbor Pribadi</h1>
        <p class="small">Kelola daftar tugas & catatan — tersimpan di perangkat Anda</p>
      </div>
      <div class="clock" id="clock">--</div>
    </header>

    <main class="grid">
      <!-- Kolom kiri: Tugas -->
      <section class="card">
        <h2>Daftar Tugas</h2>
        <form id="taskForm" class="controls">
          <input id="taskTitle" type="text" placeholder="Judul tugas" />
          <input id="taskDesc" type="text" placeholder="Deskripsi (opsional)" />
          <button type="submit">Tambah</button>
        </form>

        <div id="tasksList" class="list"></div>
      </section>

      <!-- Kolom kanan: Catatan -->
      <aside class="right">
        <section class="card">
          <h2>Catatan</h2>
          <form id="noteForm" class="controls">
            <input id="noteTitle" type="text" placeholder="Judul catatan" />
            <textarea id="noteBody" placeholder="Tulis sesuatu..." rows="3"></textarea>
            <button type="submit">Tambah Catatan</button>
          </form>

          <div id="notesList" class="list"></div>
        </section>

        <section class="card small">
          <h2>Informasi</h2>
          <p>Data tersimpan di <b>localStorage</b> browser Anda. Gunakan tombol edit atau hapus untuk mengelola.</p>
        </section>
      </aside>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
