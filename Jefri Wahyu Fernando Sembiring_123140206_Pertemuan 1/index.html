<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Manajemen Tugas Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Aplikasi Manajemen Tugas Mahasiswa</h1>

    <form id="taskForm">
      <input type="text" id="taskName" placeholder="Nama Tugas" required>
      <input type="text" id="taskCourse" placeholder="Mata Kuliah" required>
      <input type="date" id="taskDeadline" required>
      <button type="submit">Tambah Tugas</button>
    </form>

    <div class="filter-bar">
      <input type="text" id="search" placeholder="Cari tugas...">
      <span class="count">Belum selesai: <span id="count">0</span></span>
    </div>

    <ul id="taskList" class="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
